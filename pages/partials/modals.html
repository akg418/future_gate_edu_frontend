<!-- GLOBAL SEARCH MODAL -->
<div id="modal-global-search" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-start justify-center pt-16 sm:pt-24 p-4" role="dialog" aria-modal="true" aria-label="Global Search">
  <div class="bg-white rounded-3xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden relative">
    <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center gap-3">
      <i class="fa-solid fa-magnifying-glass text-brand-blue text-lg"></i>
      <input type="text" id="global-search-input" oninput="debouncedGlobalSearch()" placeholder="Search Programs, Lessons, Events, News, Teachers, Admissions..." class="flex-1 bg-transparent text-sm font-semibold text-slate-800 focus:outline-none">
      <button onclick="closeGlobalSearchModal()" class="text-slate-400 hover:text-slate-700 text-lg p-1"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="global-search-results" class="p-4 max-h-[420px] overflow-y-auto space-y-2 text-xs">
      <div class="text-center py-8 text-slate-400">Type a query to search across Future Gate National Schools platform...</div>
    </div>
  </div>
</div>

<!-- VIRTUAL TOUR VIDEO MODAL -->
<div id="modal-virtual-tour" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="bg-slate-900 rounded-3xl overflow-hidden max-w-4xl w-full shadow-2xl border border-slate-700 relative">
    <button onclick="closeVirtualTourModal()" aria-label="Close Virtual Tour" class="absolute top-4 right-4 z-10 text-white bg-black/50 w-10 h-10 rounded-full flex items-center justify-center text-lg hover:bg-red-600 transition">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="p-4 bg-brand-darkBlue text-white flex items-center justify-between">
      <h3 class="font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-school text-brand-gold"></i> Future Gate Campus Virtual Tour</h3>
    </div>
    <div class="aspect-video w-full bg-black flex items-center justify-center relative">
      <video controls class="w-full h-full object-cover">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>
</div>

<!-- LESSON VIDEO PLAYER MODAL -->
<div id="modal-lesson-player" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="bg-white rounded-3xl overflow-hidden max-w-3xl w-full shadow-2xl border border-slate-200 relative">
    <div class="p-4 bg-brand-darkBlue text-white flex items-center justify-between">
      <h3 id="lesson-modal-title" class="font-bold text-sm">Lesson Player</h3>
      <button onclick="closeLessonModal()" aria-label="Close Lesson Player" class="text-slate-300 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="aspect-video w-full bg-slate-900">
      <video id="lesson-modal-video" controls class="w-full h-full object-cover">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
      </video>
    </div>
    <div class="p-6 space-y-4">
      <div class="flex items-center justify-between text-xs text-slate-500 border-b border-slate-100 pb-3">
        <span id="lesson-modal-grade" class="font-bold text-brand-blue">Grade</span>
        <span id="lesson-modal-subject" class="font-semibold">Subject</span>
      </div>
      <p id="lesson-modal-desc" class="text-xs text-slate-600 leading-relaxed"></p>
      
      <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
        <a id="lesson-modal-download" href="#" download class="bg-blue-50 text-brand-blue hover:bg-blue-100 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
          <i class="fa-solid fa-file-pdf text-rose-500"></i> Download Lesson Notes (PDF)
        </a>
        <button id="lesson-assignment-btn" type="button" class="gold-button text-brand-darkBlue px-4 py-2 rounded-xl text-xs font-bold">
          Upload Assignment PDF
        </button>
      </div>
    </div>
  </div>
</div>
