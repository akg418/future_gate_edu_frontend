<!--
  Main navigation header.

  The desktop nav and the mobile drawer are rendered by js/components/layout.js
  from the route table, so a page the user lacks permission for never appears as
  a link. The markup below is the original design, unchanged.
-->
<header id="main-header" class="sticky top-0 z-40 glass-nav shadow-header transition-all duration-300">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-8">
    <div class="flex items-center justify-between h-20 gap-4">

      <!-- Logo & School Brand (Strictly LTR Bidi Isolated Brand Name) -->
      <a href="#/home" class="flex items-center gap-3.5 group shrink-0 py-1" aria-label="Future Gate National Schools Homepage">
        <img src="assets/img/logo.png" alt="Future Gate National Schools Logo" class="h-14 sm:h-16 w-auto object-contain transition-transform duration-300 group-hover:scale-105" />
        <div class="flex flex-col justify-center text-left rtl:text-right" dir="ltr" style="unicode-bidi: isolate;">
          <span class="font-brand-serif font-bold text-xl sm:text-2xl text-brand-blue tracking-tight leading-none group-hover:text-brand-darkBlue transition">
            Future Gate
          </span>
          <span class="font-brand-serif font-bold text-xs sm:text-base text-brand-blue tracking-tight leading-none mt-1 group-hover:text-brand-darkBlue transition">
            National Schools
          </span>
          <span class="text-[8px] sm:text-[10px] font-sans font-bold uppercase text-brand-gold mt-1 tagline-tracking">
            EXCELLENCE &middot; INTEGRITY &middot; INNOVATION
          </span>
        </div>
      </a>

      <!-- Desktop Navigation Links (rendered from the route table) -->
      <nav id="main-nav" class="hidden lg:flex items-center space-x-3.5 xl:space-x-5 rtl:space-x-reverse text-xs xl:text-sm font-semibold text-slate-700" role="navigation" aria-label="Main Navigation"></nav>

      <!-- Right Side CTA Button -->
      <div class="hidden sm:flex items-center shrink-0">
        <button onclick="showView('admissions')" class="gold-button text-brand-darkBlue font-extrabold px-5 py-2 rounded-full text-xs xl:text-sm shadow-md flex items-center gap-2">
          <i class="fa-solid fa-paper-plane text-[10px]"></i>
          <span data-i18n="btnApplyNow">Apply Now</span>
        </button>
      </div>

      <!-- Mobile Menu Toggle Button -->
      <div class="lg:hidden flex items-center gap-2">
        <button onclick="showView('admissions')" class="gold-button text-brand-darkBlue font-bold px-3 py-1.5 rounded-full text-xs sm:hidden">
          Apply Now
        </button>
        <button onclick="toggleMobileMenu()" aria-label="Toggle Navigation Menu" aria-expanded="false" class="text-slate-700 hover:text-brand-blue focus:outline-none p-2 text-xl">
          <i class="fa-solid fa-bars" id="mobile-menu-icon"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- MOBILE MENU DRAWER (rendered from the route table) -->
  <div id="mobile-menu" class="hidden lg:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-6 space-y-3 font-medium text-sm shadow-xl"></div>
</header>
