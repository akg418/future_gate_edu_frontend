<section class="page-view py-16 bg-slate-50 min-h-[70vh] flex items-center">
  <div class="max-w-md w-full mx-auto px-4">
    <div class="bg-white rounded-3xl p-8 shadow-card border border-slate-200 space-y-6">

      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-brand-darkBlue text-brand-gold flex items-center justify-center text-2xl mx-auto shadow-md">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-2xl font-bold text-brand-darkBlue font-display">Sign In</h1>
        <p class="text-xs text-slate-500">Access your <span dir="ltr" style="unicode-bidi: isolate;">Future Gate National Schools</span> account.</p>
      </div>

      <div id="login-alert" hidden class="p-3 rounded-xl text-xs font-semibold"></div>

      <form id="login-form" class="space-y-4 text-xs" novalidate>
        <div>
          <label for="login-email" class="block font-semibold text-slate-700 mb-1">Email Address *</label>
          <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="you@example.com"
                 class="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
        </div>

        <div>
          <label for="login-password" class="block font-semibold text-slate-700 mb-1">Password *</label>
          <div class="relative">
            <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password"
                   class="w-full p-3 pr-10 rtl:pr-3 rtl:pl-10 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
            <button type="button" data-toggle-password="login-password" aria-label="Show password"
                    class="absolute right-3 rtl:right-auto rtl:left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit"
                class="w-full bg-brand-blue hover:bg-brand-darkBlue text-white font-bold py-3 rounded-xl text-sm transition shadow-md">
          Sign In
        </button>
      </form>

      <p class="text-center text-xs text-slate-500">
        Don't have an account?
        <a href="#/signup" class="text-brand-blue font-bold hover:text-brand-gold transition">Create one</a>
      </p>
    </div>
  </div>
</section>
