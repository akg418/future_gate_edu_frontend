<section class="page-view py-16 bg-slate-50">
  <div class="max-w-xl w-full mx-auto px-4">
    <div class="bg-white rounded-3xl p-8 shadow-card border border-slate-200 space-y-6">

      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-brand-darkBlue text-brand-gold flex items-center justify-center text-2xl mx-auto shadow-md">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="text-2xl font-bold text-brand-darkBlue font-display">Create Your Account</h1>
        <p class="text-xs text-slate-500">Join the <span dir="ltr" style="unicode-bidi: isolate;">Future Gate National Schools</span> platform.</p>
      </div>

      <!-- Every new account is disabled until an administrator activates it. -->
      <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 text-[11px] text-amber-800 flex items-start gap-2">
        <i class="fa-solid fa-circle-info mt-0.5"></i>
        <span>New accounts are reviewed before activation. You will be able to sign in once an administrator approves your registration.</span>
      </div>

      <div id="signup-alert" hidden class="p-3 rounded-xl text-xs font-semibold"></div>

      <form id="signup-form" class="space-y-4 text-xs" novalidate>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="signup-first-name" class="block font-semibold text-slate-700 mb-1">First Name *</label>
            <input type="text" id="signup-first-name" name="firstName" required autocomplete="given-name"
                   class="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
          </div>
          <div>
            <label for="signup-last-name" class="block font-semibold text-slate-700 mb-1">Last Name *</label>
            <input type="text" id="signup-last-name" name="lastName" required autocomplete="family-name"
                   class="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
          </div>
        </div>

        <div>
          <label for="signup-email" class="block font-semibold text-slate-700 mb-1">Email Address *</label>
          <input type="email" id="signup-email" name="email" required autocomplete="email" placeholder="you@example.com"
                 class="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
        </div>

        <div>
          <label for="signup-phone" class="block font-semibold text-slate-700 mb-1">Phone Number</label>
          <input type="tel" id="signup-phone" name="phone" pattern="^(01)[0-9]{9}$" placeholder="01206192111"
                 title="11-digit Egyptian phone number"
                 class="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
        </div>

        <!-- Roles are loaded from the backend, never hardcoded in the frontend. -->
        <div>
          <label for="signup-role" class="block font-semibold text-slate-700 mb-1">I am registering as *</label>
          <select id="signup-role" name="role" required
                  class="w-full p-3 rounded-xl border border-slate-300 font-semibold focus:outline-none focus:border-brand-blue">
            <option value="">Loading available roles…</option>
          </select>
          <p id="signup-role-hint" class="text-[11px] text-slate-500 mt-1"></p>
        </div>

        <div>
          <label for="signup-password" class="block font-semibold text-slate-700 mb-1">Password *</label>
          <div class="relative">
            <input type="password" id="signup-password" name="password" required autocomplete="new-password" minlength="8"
                   class="w-full p-3 pr-10 rtl:pr-3 rtl:pl-10 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
            <button type="button" data-toggle-password="signup-password" aria-label="Show password"
                    class="absolute right-3 rtl:right-auto rtl:left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <p class="text-[11px] text-slate-500 mt-1">At least 8 characters, including a letter and a number.</p>
        </div>

        <div>
          <label for="signup-confirm" class="block font-semibold text-slate-700 mb-1">Confirm Password *</label>
          <input type="password" id="signup-confirm" name="confirmPassword" required autocomplete="new-password"
                 class="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
        </div>

        <button type="submit" id="signup-submit"
                class="w-full bg-brand-blue hover:bg-brand-darkBlue text-white font-bold py-3 rounded-xl text-sm transition shadow-md">
          Create Account
        </button>
      </form>

      <p class="text-center text-xs text-slate-500">
        Already have an account?
        <a href="#/login" class="text-brand-blue font-bold hover:text-brand-gold transition">Sign in</a>
      </p>
    </div>
  </div>
</section>
