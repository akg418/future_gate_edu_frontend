<section class="page-view py-12 bg-slate-50" data-page="contact">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-8 space-y-10">
    <div class="text-center max-w-2xl mx-auto">
      <span class="text-brand-gold font-bold text-sm uppercase tracking-wider">Get In Touch</span>
      <h1 class="text-3xl font-black text-brand-darkBlue font-display">Contact Future Gate National Schools</h1>
      <div class="w-16 h-1 bg-brand-gold mx-auto my-3 rounded-full"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-5 bg-brand-darkBlue text-white p-8 rounded-3xl space-y-6">
        <h3 class="text-xl font-bold text-brand-gold">Contact Details</h3>
        
        <div class="space-y-4 text-sm text-blue-100">
          <div class="flex items-start gap-3">
            <i class="fa-solid fa-phone text-brand-gold text-lg mt-1"></i>
            <div>
              <p class="font-bold text-white">Call Us</p>
              <p class="font-mono">01206192111</p>
            </div>
          </div>

          <div class="flex items-start gap-3">
            <i class="fa-brands fa-whatsapp text-emerald-400 text-xl mt-1"></i>
            <div>
              <p class="font-bold text-white">WhatsApp</p>
              <p class="font-mono">01206192111</p>
            </div>
          </div>

          <div class="flex items-start gap-3">
            <i class="fa-solid fa-envelope text-brand-gold text-lg mt-1"></i>
            <div>
              <p class="font-bold text-white">Email Address</p>
              <p>info@futuregate.edu</p>
            </div>
          </div>

          <div class="flex items-start gap-3">
            <i class="fa-solid fa-location-dot text-brand-gold text-lg mt-1"></i>
            <div>
              <p class="font-bold text-white">School Location</p>
              <p><span dir="ltr" style="unicode-bidi: isolate;">Future Gate National Schools</span> Campus, Cairo, Egypt</p>
            </div>
          </div>
        </div>

        <div class="rounded-2xl overflow-hidden bg-blue-900/60 p-4 border border-blue-700/50 text-center">
          <i class="fa-solid fa-map-location-dot text-4xl text-brand-gold mb-2"></i>
          <p class="text-xs text-blue-200">Interactive Google Maps Location Loaded</p>
        </div>
      </div>

      <div class="lg:col-span-7 bg-white p-8 rounded-3xl shadow-card border border-slate-200">
        <h3 class="text-xl font-bold text-brand-darkBlue mb-4">Send Us A Message</h3>
        <form class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Your Name *</label>
            <input type="text" id="contact-name" name="name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-brand-blue">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Phone *</label>
              <input type="tel" id="contact-phone" name="phone" required pattern="^(01)[0-9]{9}$" title="11-digit Egyptian phone number" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-brand-blue">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Email *</label>
              <input type="email" id="contact-email" name="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-brand-blue">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Message *</label>
            <textarea id="contact-msg" name="message" rows="4" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-brand-blue"></textarea>
          </div>
          <button type="submit" class="bg-brand-blue hover:bg-brand-darkBlue text-white font-bold px-8 py-3 rounded-xl shadow transition text-sm">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
