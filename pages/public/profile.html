<section class="page-view py-12 bg-slate-50">
  <div class="max-w-4xl mx-auto px-4 sm:px-8 space-y-6">

    <div class="bg-brand-darkBlue text-white p-6 rounded-3xl shadow-xl flex flex-wrap items-center gap-4">
      <div id="profile-avatar" class="w-16 h-16 rounded-2xl bg-brand-gold text-brand-darkBlue flex items-center justify-center text-xl font-black shrink-0"></div>
      <div class="flex-1 min-w-[12rem]">
        <h1 id="profile-name" class="text-xl font-bold text-white font-display"></h1>
        <p id="profile-email" class="text-xs text-blue-200"></p>
        <p class="text-xs text-blue-200 mt-1">Role: <span id="profile-role" class="text-brand-gold font-bold"></span></p>
      </div>
      <div class="text-right rtl:text-left">
        <span id="profile-status" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase"></span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="font-bold text-slate-900 text-base border-b border-slate-100 pb-3">Personal Details</h2>
        <form id="profile-form" class="space-y-4 text-xs">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">First Name</label>
              <input type="text" name="firstName" id="profile-first-name" class="w-full p-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Last Name</label>
              <input type="text" name="lastName" id="profile-last-name" class="w-full p-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
            </div>
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Phone Number</label>
            <input type="tel" name="phone" id="profile-phone" pattern="^(01)[0-9]{9}$" class="w-full p-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
          </div>
          <button type="submit" class="bg-brand-blue hover:bg-brand-darkBlue text-white px-6 py-2.5 rounded-xl font-bold transition">Save Changes</button>
        </form>
      </div>

      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="font-bold text-slate-900 text-base border-b border-slate-100 pb-3">Change Password</h2>
        <form id="password-form" class="space-y-4 text-xs">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Current Password</label>
            <input type="password" name="currentPassword" required autocomplete="current-password" class="w-full p-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">New Password</label>
            <input type="password" name="newPassword" required minlength="8" autocomplete="new-password" class="w-full p-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-brand-blue" />
            <p class="text-[11px] text-slate-500 mt-1">At least 8 characters, including a letter and a number.</p>
          </div>
          <button type="submit" class="bg-brand-blue hover:bg-brand-darkBlue text-white px-6 py-2.5 rounded-xl font-bold transition">Update Password</button>
        </form>
      </div>
    </div>

    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
      <h2 class="font-bold text-slate-900 text-base border-b border-slate-100 pb-3">My Permissions</h2>
      <p class="text-xs text-slate-500">These determine which pages and actions are available to you.</p>
      <div id="profile-permissions" class="flex flex-wrap gap-1.5"></div>
    </div>

  </div>
</section>
