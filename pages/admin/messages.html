<section class="page-view py-8 bg-slate-100 min-h-screen" data-page="admin-messages">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-8 space-y-6">

    <div class="bg-brand-darkBlue text-white p-6 rounded-3xl shadow-xl flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-brand-gold text-brand-darkBlue flex items-center justify-center text-xl">
          <i class="fa-solid fa-envelope"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white font-display">Contact Messages</h1>
          <p class="text-xs text-blue-200">Messages submitted through the website contact form.</p>
        </div>
      </div>
      <button id="export-messages-btn" data-permission="messages.export"
              class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-file-excel"></i> Export CSV
      </button>
    </div>

    <nav id="admin-nav" class="bg-white p-2 rounded-2xl border border-slate-200 flex flex-wrap gap-2 text-xs font-bold"></nav>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] text-slate-500 font-bold uppercase">Total</span>
        <div class="text-xl font-black text-brand-darkBlue mt-1" id="msg-stat-total">—</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] text-slate-500 font-bold uppercase">Unread</span>
        <div class="text-xl font-black text-rose-600 mt-1" id="msg-stat-new">—</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] text-slate-500 font-bold uppercase">Replied</span>
        <div class="text-xl font-black text-emerald-600 mt-1" id="msg-stat-replied">—</div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] text-slate-500 font-bold uppercase">Archived</span>
        <div class="text-xl font-black text-slate-500 mt-1" id="msg-stat-archived">—</div>
      </div>
    </div>

    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="font-bold text-slate-900 text-base">All Messages</h2>
        <span class="text-xs text-slate-500">Stored in MongoDB &middot; updated live from the website form</span>
      </div>
      <div id="messages-table"></div>
    </div>

  </div>
</section>
