<section class="page-view py-8 bg-slate-100 min-h-screen" data-page="admin-roles">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-8 space-y-6">

    <div class="bg-brand-darkBlue text-white p-6 rounded-3xl shadow-xl flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-brand-gold text-brand-darkBlue flex items-center justify-center text-xl">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white font-display">Roles &amp; Permissions</h1>
          <p class="text-xs text-blue-200">Create roles and grant them any combination of permissions.</p>
        </div>
      </div>
      <div class="flex items-center gap-3"><button id="add-role-btn" data-permission="roles.create"
                class="bg-brand-gold hover:bg-amber-500 text-brand-darkBlue px-3.5 py-2 rounded-xl text-xs font-bold transition">
          <i class="fa-solid fa-plus"></i> New Role
        </button></div>
    </div>

    <nav id="admin-nav" class="bg-white p-2 rounded-2xl border border-slate-200 flex flex-wrap gap-2 text-xs font-bold"></nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <div class="lg:col-span-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <h2 class="font-bold text-slate-900 text-base">Roles</h2>
          <span id="roles-count" class="text-xs text-slate-500"></span>
        </div>
        <div id="roles-list" class="space-y-2"></div>
      </div>

      <div class="lg:col-span-8 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
          <div>
            <h2 class="font-bold text-slate-900 text-base" id="matrix-role-name">Select a role</h2>
            <p class="text-xs text-slate-500" id="matrix-role-meta">Choose a role on the left to view and edit its permissions.</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="matrix-select-all" hidden class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">Select all</button>
            <button id="matrix-clear-all" hidden class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">Clear all</button>
            <button id="matrix-save" hidden data-permission="roles.assign-permissions"
                    class="bg-brand-blue hover:bg-brand-darkBlue text-white px-5 py-1.5 rounded-lg text-xs font-bold transition">
              <i class="fa-solid fa-floppy-disk"></i> Save Permissions
            </button>
          </div>
        </div>

        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 rtl:left-auto rtl:right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input id="matrix-search" type="search" placeholder="Filter permissions…"
                 class="w-full pl-9 rtl:pl-4 rtl:pr-9 pr-4 py-2.5 rounded-xl border border-slate-300 text-xs focus:outline-none focus:border-brand-blue" />
        </div>

        <div id="permission-matrix" class="space-y-4 max-h-[32rem] overflow-y-auto pr-1"></div>
      </div>

    </div>
  </div>
</section>
